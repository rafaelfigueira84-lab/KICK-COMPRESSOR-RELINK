name: Build Windows VST3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'Source/**'
      - '.github/workflows/build-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --target RELINKKickEnhancer_VST3 --parallel 4
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: RELINK-Kick-Enhancer-Windows-VST3
          path: build/RELINKKickEnhancer_artefacts/Release/VST3/*.vst3
          if-no-files-found: error
